name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what you got instead of what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Press Home
        2. Select an area
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: reshot version
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: 'Settings, System, About, the "OS build" line'
      placeholder: 'Windows 11 23H2, build 22631.4317'
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        `%AppData%\reshot\logs\reshot.log`, the last lines from around the failure.
        The application lives in the tray, so a crash almost always leaves a trace there.
      render: text
