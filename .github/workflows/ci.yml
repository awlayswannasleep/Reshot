name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # reshot is Windows-only: WPF, Windows.Graphics.Capture and Media Foundation.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore reshot.sln

      - name: Build
        run: dotnet build reshot.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Reshot.Core.Tests/Reshot.Core.Tests.csproj -c Release --no-build --verbosity normal
